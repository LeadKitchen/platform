apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: sitruk
data:
  NODE_ENV: "production"
  PORT: "3000"

  # TODO: replace with the real public URL once DNS/Ingress are set up.
  APP_URL: "https://sitruk.example.com"
  NEXT_PUBLIC_APP_URL: "https://sitruk.example.com"
  NEXT_PUBLIC_APP_NAME: "Ситрук"
  NEXT_PUBLIC_APP_SHORT_NAME: "Acme"

  # Production sends real email — no local sandbox catcher in this cluster.
  EMAIL_SANDBOX_ENABLED: "false"

  # S3-compatible storage (Yandex Cloud Object Storage). Credentials go in
  # app-secret.yaml; only non-secret settings live here.
  AWS_S3_ENDPOINT: "https://storage.yandexcloud.net"
  AWS_S3_FORCE_PATH_STYLE: "false"
  AWS_REGION: "ru-central1"
  AWS_S3_BUCKET: ""

  # Comma-separated emails allowed to access /admin and admin API procedures.
  ADMIN_EMAILS: "admin@example.com"

  # AI_PROVIDER: "anthropic"
  # AI_MODEL: "claude-opus-5"
  # AI_EFFORT: "medium"
  # AI_DEFAULT_VARIANT: "baseline"

  TRIGGER_PROJECT_REF: ""
