# Bootstrap: fill in app-secret.yaml, then `kubectl apply -k k3s/`.
# The deploy-k3s.yml workflow only updates the image on the Deployment
# created here (kubectl set image) — it doesn't apply these manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - app-configmap.yaml
  - app-secret.yaml
  - app-deployment.yaml
  - app-service.yaml
  - app-ingress.yaml
