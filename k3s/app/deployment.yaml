apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: orixon
  labels:
    app: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          # Built from docker/app.Dockerfile at the repo root — see k3s/README.md.
          image: <registry>/orixon-app:<tag>
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: orixon-secrets
          # No dedicated health endpoint exists yet — probing "/" against the
          # Next.js server. Swap for a real health route if one is added.
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
