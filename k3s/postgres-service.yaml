apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sitruk
  labels:
    app: postgres
spec:
  # Headless: the app should always talk to the single postgres-0 pod
  # directly, not to a load-balanced VIP.
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
