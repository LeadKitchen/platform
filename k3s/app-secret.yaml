# Template only — every value below is a placeholder. Fill them in with
# `kubectl edit secret app-secret -n sitruk` (or apply your own copy) and
# never commit the real values.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: sitruk
type: Opaque
stringData:
  # Points at the in-cluster postgres StatefulSet/Service (postgres-*.yaml).
  # Password must match postgres-secret.yaml's POSTGRES_PASSWORD.
  # e.g. postgres://postgres:<password>@postgres:5432/acme
  POSTGRES_URL: ""

  # Required in production. Generate with: openssl rand -base64 32
  AUTH_SECRET: ""
  AUTH_GOOGLE_ID: ""
  AUTH_GOOGLE_SECRET: ""

  RESEND_API_KEY: ""

  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""

  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""

  TRIGGER_SECRET_KEY: ""
  INNGEST_EVENT_KEY: ""
  INNGEST_SIGNING_KEY: ""

  LMNR_PROJECT_API_KEY: ""
  DEEPGRAM_API_KEY: ""
  ELEVENLABS_API_KEY: ""
