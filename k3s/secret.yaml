# Template only — do not commit real values or apply this file as-is.
#
# Fill in the values from your .env and apply with:
#   kubectl apply -n orixon -f secret.yaml
# (keep the filled-in copy, `secret.yaml`, out of git — it's already covered
# by the repo-root .gitignore rule for `.env*`, but double-check before
# committing anything under k3s/).
#
# Shared by both `app` and `worker` — the worker only reads a subset (DB,
# storage, AI, Hatchet, Docling/MinerU/Qdrant/Neo4j), the rest are here so a
# single Secret name works for both envFrom blocks.
apiVersion: v1
kind: Secret
metadata:
  name: orixon-secrets
  namespace: orixon
type: Opaque
stringData:
  # Database
  POSTGRES_URL: ""

  # Auth (better-auth) — generate with: openssl rand -base64 32
  AUTH_SECRET: ""
  AUTH_GOOGLE_ID: ""
  AUTH_GOOGLE_SECRET: ""

  # Email
  RESEND_API_KEY: ""

  # AI module
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""

  # S3-compatible object storage
  AWS_S3_ENDPOINT: ""
  AWS_S3_FORCE_PATH_STYLE: "false"
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: ""
  AWS_S3_BUCKET: ""

  # Knowledge-base parsing/indexing services
  DOCLING_SERVICE_URL: ""
  MINERU_SERVICE_URL: ""
  QDRANT_URL: ""
  QDRANT_API_KEY: ""
  NEO4J_URL: ""
  NEO4J_USER: ""
  NEO4J_PASSWORD: ""

  # Hatchet Cloud — API token minted for a tenant at
  # https://cloud.onhatchet.run → Settings → API Tokens.
  HATCHET_CLIENT_TOKEN: ""

  # Observability (optional)
  LMNR_PROJECT_API_KEY: ""
  ADMIN_EMAILS: ""

  # Voice dialog room (optional)
  DEEPGRAM_API_KEY: ""
  ELEVENLABS_API_KEY: ""
