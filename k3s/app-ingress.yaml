# TODO: replace host with the real domain before applying.
# To get TLS via cert-manager, add a "cert-manager.io/cluster-issuer"
# annotation and a `tls:` block once cert-manager is installed on the
# cluster — omitted here so this applies cleanly on a bare k3s + Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: sitruk
spec:
  ingressClassName: traefik
  rules:
    - host: sitruk.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
