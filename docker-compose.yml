volumes:
  minio:
  postgres:
  qdrant:
  neo4j:
services:
  inbucket:
    restart: always
    image: inbucket/inbucket:latest
    container_name: inbucket
    ports:
      - 9000:9000
      - 2500:2500
      - 1100:1100
    environment:
      - INBUCKET_WEB_ADDR=0.0.0.0:9000
      - INBUCKET_SMTP_ADDR=0.0.0.0:2500
      - INBUCKET_POP3_ADDR=0.0.0.0:1100
  minio:
    restart: always
    image: minio/minio
    container_name: minio
    ports:
      - 9002:9002
      - 9001:9001
    volumes:
      - minio:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: password
    entrypoint: sh
    command: -c 'mkdir -p /data/minio && minio server /data --console-address ":9001" --address ":9002"'
  create-buckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc config host add minio http://minio:9002 minio password;
      /usr/bin/mc rb minio/files.acme.com;
      /usr/bin/mc mb minio/files.acme.com;
      /usr/bin/mc anonymous set public minio/files.acme.com;
      exit 0;
      "
  postgres:
    restart: always
    image: postgres:18-alpine
    container_name: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: acme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
  docling:
    restart: always
    build:
      context: ./services/docling-parser
    container_name: docling
    ports:
      # Host-only: /parse takes an arbitrary file and runs OCR unauthenticated —
      # fine for the TS job on localhost, not for exposing to the network.
      - 127.0.0.1:8088:8088
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # Model download at image build time makes startup itself fast; the
      # long window here is for `docker compose up` on a machine building
      # the image for the first time.
      start_period: 60s
  mineru:
    restart: always
    build:
      context: ./services/mineru-parser
    container_name: mineru
    ports:
      - 127.0.0.1:8089:8089
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8089/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # Heavier model set than Docling's and CPU-only inference — more
      # startup headroom on a machine building the image for the first time.
      start_period: 120s
  qdrant:
    restart: always
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      # org-fusion-rag's vector channel — additive to pgvector, see
      # docs/ai-module.md.
      - 127.0.0.1:6333:6333
    volumes:
      - qdrant:/qdrant/storage
    # No compose healthcheck: the official image is a minimal static
    # binary with no shell utilities (curl/wget) confirmed present to
    # probe with.
  neo4j:
    restart: always
    image: neo4j:5
    container_name: neo4j
    ports:
      # org-fusion-rag's graph channel — separate from the built-in
      # in-memory graph-rag strategy, which needs no database.
      - 127.0.0.1:7474:7474
      - 127.0.0.1:7687:7687
    volumes:
      - neo4j:/data
    environment:
      NEO4J_AUTH: neo4j/password
