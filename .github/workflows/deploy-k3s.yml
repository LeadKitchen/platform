name: Deploy to k3s

on:
  push:
    branches: ["main"]
    paths:
      - "apps/app/**"
      - "packages/**"
      - "tooling/**"
      - "bun.lock"
      - ".github/workflows/deploy-k3s.yml"

concurrency:
  group: deploy-k3s
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: meta
        run: echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/app/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$RUNNER_TEMP/.kube"
          printf '%s' "$KUBE_CONFIG" > "$RUNNER_TEMP/.kube/config"
          chmod 600 "$RUNNER_TEMP/.kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> "$GITHUB_ENV"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify cluster connection
        run: kubectl cluster-info

      # Existing Deployment/container names and namespace live in your own
      # k8s manifests, not in this repo. Set them as repository variables
      # under Settings > Secrets and variables > Actions > Variables:
      #   K3S_NAMESPACE  (defaults to "default")
      #   K3S_DEPLOYMENT (required, e.g. "app")
      #   K3S_CONTAINER  (defaults to K3S_DEPLOYMENT)
      - name: Deploy new image
        env:
          NAMESPACE: ${{ vars.K3S_NAMESPACE || 'default' }}
          DEPLOYMENT: ${{ vars.K3S_DEPLOYMENT }}
          CONTAINER: ${{ vars.K3S_CONTAINER || vars.K3S_DEPLOYMENT }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image }}
        run: |
          if [ -z "$DEPLOYMENT" ]; then
            echo "::error::Set the K3S_DEPLOYMENT repository variable to your Deployment's name."
            exit 1
          fi

          kubectl set image "deployment/${DEPLOYMENT}" "${CONTAINER}=${IMAGE_TAG}" \
            -n "$NAMESPACE"
          kubectl rollout status "deployment/${DEPLOYMENT}" -n "$NAMESPACE" --timeout=180s
