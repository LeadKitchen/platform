name: Deploy to k3s

on:
  push:
    branches: ["main"]
    paths:
      - "apps/app/**"
      - "packages/**"
      - "tooling/**"
      - "bun.lock"
      - ".env.example"
      - "docker/worker.Dockerfile"
      - ".github/workflows/deploy-k3s.yml"

concurrency:
  group: deploy-k3s
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/leadkitchen/platform/app
  WORKER_IMAGE: ghcr.io/leadkitchen/platform/worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_image: ${{ steps.meta.outputs.app_image }}
      worker_image: ${{ steps.meta.outputs.worker_image }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: meta
        run: |
          echo "app_image=${APP_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "worker_image=${WORKER_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/app/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.app_image }}
            ${{ env.APP_IMAGE }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.worker_image }}
            ${{ env.WORKER_IMAGE }}:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    steps:
      - name: Set up kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$RUNNER_TEMP/.kube"
          printf '%s' "$KUBE_CONFIG" > "$RUNNER_TEMP/.kube/config"
          chmod 600 "$RUNNER_TEMP/.kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> "$GITHUB_ENV"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify cluster connection
        run: kubectl cluster-info

      # Defaults match k3s/app.yaml and k3s/worker.yaml (namespace: orixon,
      # Deployment/container names: app / worker). Override via repository
      # variables under Settings > Secrets and variables > Actions >
      # Variables if your cluster differs: K3S_NAMESPACE.
      - name: Deploy new images
        env:
          NAMESPACE: ${{ vars.K3S_NAMESPACE || 'orixon' }}
          APP_IMAGE_TAG: ${{ needs.build-and-push.outputs.app_image }}
          WORKER_IMAGE_TAG: ${{ needs.build-and-push.outputs.worker_image }}
        run: |
          kubectl set image deployment/sitruk-app app="${APP_IMAGE_TAG}" -n "$NAMESPACE"
          kubectl set image deployment/worker worker="${WORKER_IMAGE_TAG}" -n "$NAMESPACE"
          kubectl rollout status deployment/sitruk-app -n "$NAMESPACE" --timeout=180s
          kubectl rollout status deployment/worker -n "$NAMESPACE" --timeout=180s
